asyncapi: 3.0.0
info:
  title: Hoox Event-Driven Architecture
  version: 1.0.0
  description: |
    Event-driven message flows powering the Hoox algorithmic trading
    platform on the Cloudflare edge.

    Covers Cloudflare Service Bindings (V8 worker-to-worker calls),
    Queues (async trade execution), Cron triggers (AI risk assessment),
    Durable Objects (idempotency), and Email Routing (signal parsing).

    **Worker Topology:**

    ```
    External → hoox (Gateway) ──→ trade-worker ──→ d1-worker
                                ──→ telegram-worker
                                ──→ web3-wallet-worker
                    agent-worker ──→ trade-worker, telegram-worker, d1-worker
                    email-worker ──→ trade-worker
                    dashboard ──→ d1-worker, agent-worker
    ```
servers:
  production:
    host: cloudflare-workers
    protocol: cloudflare-workers
    description: Cloudflare Workers edge runtime with V8 Service Bindings
  queue:
    host: cloudflare-queues
    protocol: cloudflare-queues
    description: Cloudflare Queues for asynchronous message delivery
defaultContentType: application/json
channels:
  TradeWebhook:
    address: /webhook
    title: Trade signal webhook
    description: |
      Incoming trade signals from TradingView, cURL, or any HTTP client.
      Received by the hoox gateway, validated, and forwarded to the
      execution engine.
    messages:
      WebhookSignal:
        $ref: "#/components/messages/WebhookSignal"
  TradeExecution:
    address: trade-worker
    title: Trade execution
    description: |
      Service binding call from gateway (or email-worker) to trade-worker
      for synchronous trade execution.
    messages:
      TradeRequest:
        $ref: "#/components/messages/TradeRequest"
  TradeQueue:
    address: TRADE_QUEUE
    title: Trade execution queue
    description: |
      Cloudflare Queue for asynchronous trade execution. Three modes
      controlled by KV config: queue_everywhere, queue_failover (default),
      or queue_disabled.
    messages:
      QueuedTrade:
        $ref: "#/components/messages/QueuedTrade"
  DatabaseQuery:
    address: d1-worker
    title: D1 database operations
    description: |
      Parameterized SQL queries and batch statements executed against
      Cloudflare D1 (SQLite at the edge). Accessed via service binding
      from trade-worker, agent-worker, and dashboard.
    messages:
      SqlQuery:
        $ref: "#/components/messages/SqlQuery"
      SqlBatch:
        $ref: "#/components/messages/SqlBatch"
  TelegramNotification:
    address: telegram-worker
    title: Telegram notifications
    description: |
      Push notifications sent to Telegram via the Hoox bot. Triggered by
      the gateway, agent-worker, web3-wallet-worker, and report-worker
      via service binding.
    messages:
      TelegramAlert:
        $ref: "#/components/messages/TelegramAlert"
  WalletOperation:
    address: web3-wallet-worker
    title: DeFi wallet operations
    description: |
      On-chain EVM operations — swaps, balance checks, approvals —
      proxied from the gateway through service binding.
    messages:
      DexSwap:
        $ref: "#/components/messages/DexSwap"
  risk/cron:
    address: agent-worker/cron
    title: Scheduled AI risk assessment (cron)
    description: |
      Scheduled AI-powered risk analysis running every 5 minutes via the
      Cloudflare Workers `scheduled` handler in `workers/agent-worker`.
      The cron trigger invokes `runHousekeeping` and `processRoutine`,
      analyzing positions, market conditions, and adjusting trailing
      stops. Receives a `RiskOverride` message that may carry a
      human-supplied trailing-stop override to apply.
    messages:
      RiskOverride:
        $ref: "#/components/messages/RiskOverride"
  risk/chat:
    address: agent-worker/agent/chat
    title: AI chat session
    description: |
      Conversational AI request handled by `POST /agent/chat` in the
      agent-worker. Invoked from the dashboard and CLI. Supports
      multi-provider chat completions (`openai`, `anthropic`,
      `workers-ai`, `google`) via the `provider` field.
    messages:
      AiChatRequest:
        $ref: "#/components/messages/AiChatRequest"
  risk/embedding:
    address: agent-worker/agent/embedding
    title: Text embedding generation
    description: |
      Vector embedding request handled by `POST /agent/embedding` in
      the agent-worker. Used by the dashboard and automation to
      generate embeddings via Workers AI (default) or another
      configured provider.
    messages:
      EmbeddingRequest:
        $ref: "#/components/messages/EmbeddingRequest"
  risk/config:
    address: agent-worker/agent/config
    title: AI agent configuration
    description: |
      Agent configuration read/write handled by
      `GET /agent/config` and `POST /agent/config` in the
      agent-worker. Updates the provider manager's
      `defaultProvider`, `fallbackChain`, and `modelMap`, which are
      persisted in `CONFIG_KV`.
    messages:
      AgentConfig:
        $ref: "#/components/messages/AgentConfig"
  IdempotencyStore:
    address: IdempotencyStore
    title: Idempotency Durable Object
    description: |
      Durable Object that maintains a 24-hour lock on processed trade
      keys to prevent duplicate execution. Accessed via **Cloudflare
      Durable Object RPC** (not HTTP) from the gateway's logic layer
      using the `IDEMPOTENCY_STORE` binding declared in
      `workers/hoox-worker/wrangler.jsonc`. The DO class name is
      `IdempotencyStore` (`workers/hoox-worker/src/idempotencyStore.ts`) and
      the binding name in the worker env is `IDEMPOTENCY_STORE`.
    bindings:
      durable-object:
        name: IDEMPOTENCY_STORE
        className: IdempotencyStore
        bindingType: rpc
    messages:
      IdempotencyKey:
        $ref: "#/components/messages/IdempotencyKey"
  EmailParsing:
    address: email-worker
    title: Email signal parsing
    description: |
      Parses incoming trade signals from forwarded emails. Uses
      Cloudflare Email Routing to receive and process messages,
      then forwards parsed signals to trade-worker.
    messages:
      EmailSignal:
        $ref: "#/components/messages/EmailSignal"
  AnalyticsTracking:
    address: analytics-worker
    title: Analytics and reporting
    description: |
      Usage and performance analytics aggregation. Receives events from
      all workers for dashboard metrics and billing.
    messages:
      AnalyticsEvent:
        $ref: "#/components/messages/AnalyticsEvent"
  PDFReport:
    address: report-worker
    title: PDF report generation
    description: |
      Generates PDF trade reports using Cloudflare Browser Rendering
      API. Triggered on demand via service binding from the dashboard
      or CLI.
    messages:
      ReportRequest:
        $ref: "#/components/messages/ReportRequest"
components:
  messages:
    WebhookSignal:
      name: WebhookSignal
      title: Webhook trade signal
      summary: Incoming trade signal from external webhook source
      contentType: application/json
      payload:
        type: object
        required:
          - apiKey
          - exchange
          - action
          - symbol
          - quantity
        properties:
          apiKey:
            type: string
            description: Webhook authentication key
          exchange:
            type: string
            enum:
              - binance
              - bybit
              - mexc
            description: Target exchange
          action:
            type: string
            enum:
              - LONG
              - SHORT
              - CLOSE_LONG
              - CLOSE_SHORT
            description: Trade action
          symbol:
            type: string
            maxLength: 20
            description: Trading pair
          quantity:
            type: number
            description: Order size
          price:
            type: number
            description: Optional limit price
          leverage:
            type: integer
            description: Optional margin leverage
          idempotencyKey:
            type: string
            description: |
              Optional client-supplied dedup signature. If omitted, the
              gateway auto-generates one as
              `SHA256(symbol + exchange + action + timestamp)`.
            example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          notify:
            type: object
            description: Optional Telegram notification
            properties:
              chatId:
                type: string
              message:
                type: string
    TradeRequest:
      name: TradeRequest
      title: Trade execution request
      summary: Internal trade payload forwarded to trade-worker
      contentType: application/json
      payload:
        type: object
        required:
          - requestId
          - exchange
          - action
          - symbol
          - quantity
        properties:
          requestId:
            type: string
            format: uuid
            description: Distributed trace ID
          exchange:
            type: string
            description: Target exchange
          action:
            type: string
            description: Trade action
          symbol:
            type: string
            description: Trading pair
          quantity:
            type: number
            description: Order size
          price:
            type: number
            description: Optional limit price
          leverage:
            type: integer
            description: Optional margin leverage
    QueuedTrade:
      name: QueuedTrade
      title: Queued trade message
      summary: Trade message enqueued via Cloudflare Queue
      contentType: application/json
      payload:
        type: object
        required:
          - requestId
          - exchange
          - action
          - symbol
          - quantity
          - queuedAt
        properties:
          requestId:
            type: string
            format: uuid
          exchange:
            type: string
          action:
            type: string
          symbol:
            type: string
          quantity:
            type: number
          price:
            type: number
          leverage:
            type: integer
          queuedAt:
            type: string
            format: date-time
            description: ISO-8601 timestamp of when the message was queued
    SqlQuery:
      name: SqlQuery
      title: D1 SQL query
      summary: Parameterized SQL query for D1 database
      contentType: application/json
      payload:
        type: object
        required:
          - query
        properties:
          requestId:
            type: string
            format: uuid
            description: Distributed trace ID
          query:
            type: string
            description: Parameterized SQL statement
          params:
            type: array
            items:
              type: string
            description: SQL parameter bindings
    SqlBatch:
      name: SqlBatch
      title: D1 SQL batch
      summary: Multiple parameterized SQL statements in a transaction
      contentType: application/json
      payload:
        type: object
        required:
          - queries
        properties:
          requestId:
            type: string
            format: uuid
          queries:
            type: array
            items:
              $ref: "#/components/messages/SqlQuery/payload"
    TelegramAlert:
      name: TelegramAlert
      title: Telegram notification
      summary: Push notification delivered via Telegram bot
      contentType: application/json
      payload:
        type: object
        required:
          - message
          - chatId
        properties:
          requestId:
            type: string
            format: uuid
          message:
            type: string
            description: Formatted message content (supports HTML/Markdown)
          chatId:
            type: string
            description: Target Telegram chat ID
          parseMode:
            type: string
            enum:
              - HTML
              - MarkdownV2
            description: Message formatting mode
    DexSwap:
      name: DexSwap
      title: DEX swap operation
      summary: On-chain DeFi swap or token operation
      contentType: application/json
      payload:
        type: object
        required:
          - chain
          - to
          - value
          - data
        properties:
          chain:
            type: string
            enum:
              - ethereum
              - arbitrum
              - polygon
            description: EVM-compatible chain
          to:
            type: string
            description: Recipient or contract address
          value:
            type: string
            description: Transaction value in wei (string)
          data:
            type: string
            description: Encoded contract call data
          gasLimit:
            type: integer
            description: Optional gas limit override
    RiskOverride:
      name: RiskOverride
      title: Risk override
      summary: AI agent trailing stop override
      contentType: application/json
      payload:
        type: object
        properties:
          trailingStopPercent:
            type: number
            minimum: 0
            maximum: 100
            description: Global trailing stop percentage override
    AgentConfig:
      name: AgentConfig
      title: Agent configuration
      summary: AI agent configuration update
      contentType: application/json
      payload:
        type: object
        properties:
          defaultProvider:
            type: string
            enum:
              - workers-ai
              - openai
              - anthropic
              - google
          fallbackChain:
            type: array
            items:
              type: string
          modelMap:
            type: object
            description: Provider-to-model mapping overrides
    AiChatRequest:
      name: AiChatRequest
      title: AI chat request
      summary: Multi-provider AI chat request
      contentType: application/json
      payload:
        type: object
        properties:
          prompt:
            type: string
            description: Chat prompt
          stream:
            type: boolean
            description: Enable streaming response
          provider:
            type: string
            enum:
              - openai
              - anthropic
              - workers-ai
              - google
            description: AI provider to use
    EmbeddingRequest:
      name: EmbeddingRequest
      title: Embedding generation request
      summary: Generate text embeddings via Workers AI
      contentType: application/json
      payload:
        type: object
        required:
          - text
        properties:
          text:
            type: string
            minLength: 1
            maxLength: 10000
            description: Text to embed
          provider:
            type: string
            description: Optional provider override
    IdempotencyKey:
      name: IdempotencyKey
      title: Idempotency key
      summary: Trade idempotency check key
      contentType: text/plain
      payload:
        type: string
        description: "Format: trade:{exchange}:{symbol}:{action}:{quantity}"
    EmailSignal:
      name: EmailSignal
      title: Email trade signal
      summary: |
        Trade signal parsed from a forwarded email. Two delivery paths
        converge on the same envelope:

        1. **Cloudflare Email Routing** — the email worker receives a
           `ForwardableEmailMessage` whose `.raw` field is the RFC 822
           message stream. The worker reads it as a multipart MIME
           body and extracts `from`, `subject`, and the plain-text part.
        2. **Mailgun webhook** — `POST /webhook` arrives as
           `multipart/form-data` with fields like `body-plain`,
           `stripped-text`, `from`, and `subject`.

        Both paths yield the same logical payload described below
        (extracted headers + parsed trade parameters).
      contentType: multipart/form-data
      payload:
        type: object
        description: |
          Multipart form body. Field names match the upstream provider:

          - Cloudflare Email Routing: `from`, `subject`, `body`
            (extracted from the raw RFC 822 stream by the worker).
          - Mailgun: `from`, `subject`, `body-plain` or `stripped-text`.

          The worker unifies these into a single `EmailSignal` shape
          before forwarding to the trade-worker via service binding.
        properties:
          from:
            type: string
            format: email
            description: Sender email address (from the envelope)
          subject:
            type: string
            description: Email subject line
          body:
            type: string
            description: |
              Plain-text email body. The worker reads either
              `body-plain` / `stripped-text` (Mailgun) or the raw
              text MIME part (Cloudflare Email Routing).
          parsedSignal:
            type: object
            description: |
              Extracted trade parameters — populated by
              `parseEmailSignal` after pattern matching against
              `CONFIG_KV.email.*` regex keys.
            properties:
              exchange:
                type: string
                enum:
                  - binance
                  - bybit
                  - mexc
                description: Normalized exchange identifier
              action:
                type: string
                enum:
                  - buy
                  - sell
                description: Normalized action (`buy` / `sell`)
              symbol:
                type: string
                description: Uppercased, sanitized trading pair
              quantity:
                type: number
                description: |
                  Order size, multiplied by
                  `CONFIG_KV.email.quantity_multiplier`
    AnalyticsEvent:
      name: AnalyticsEvent
      title: Analytics event
      summary: Usage and performance metric
      contentType: application/json
      payload:
        type: object
        properties:
          worker:
            type: string
            description: Source worker name
          endpoint:
            type: string
            description: API endpoint path
          latencyMs:
            type: integer
            description: Request processing time
          success:
            type: boolean
            description: Whether the operation succeeded
    ReportRequest:
      name: ReportRequest
      title: PDF report request
      summary: Generate a PDF trade report via Browser Rendering
      contentType: application/json
      payload:
        type: object
        properties:
          requestId:
            type: string
            format: uuid
          format:
            type: string
            enum:
              - pdf
            description: Output format
          dateRange:
            type: object
            properties:
              start:
                type: string
                format: date-time
                description: Report start date
              end:
                type: string
                format: date-time
                description: Report end date
operations:
  receiveSignal:
    action: receive
    channel:
      $ref: "#/channels/TradeWebhook"
    messages:
      - $ref: "#/channels/TradeWebhook/messages/WebhookSignal"
    summary: Gateway receives external trade signal via HTTP POST
    title: Receive trade signal
  executeTrade:
    action: send
    channel:
      $ref: "#/channels/TradeExecution"
    messages:
      - $ref: "#/channels/TradeExecution/messages/TradeRequest"
    summary: Gateway sends validated trade to trade-worker via service binding
    title: Forward trade for execution
  processTradeFromEmail:
    action: send
    channel:
      $ref: "#/channels/TradeExecution"
    messages:
      - $ref: "#/channels/TradeExecution/messages/TradeRequest"
    summary: Email-worker sends parsed trade signal to trade-worker
    title: Forward parsed email signal
  enqueueTrade:
    action: send
    channel:
      $ref: "#/channels/TradeQueue"
    messages:
      - $ref: "#/channels/TradeQueue/messages/QueuedTrade"
    summary: Gateway sends trade to queue instead of direct service call
    title: Enqueue trade for async execution
  dequeueTrade:
    action: receive
    channel:
      $ref: "#/channels/TradeQueue"
    messages:
      - $ref: "#/channels/TradeQueue/messages/QueuedTrade"
    summary: Trade-worker consumer processes enqueued trades
    title: Process queued trade
  querySingle:
    action: send
    channel:
      $ref: "#/channels/DatabaseQuery"
    messages:
      - $ref: "#/channels/DatabaseQuery/messages/SqlQuery"
    title: Execute single SQL query
  queryBatch:
    action: send
    channel:
      $ref: "#/channels/DatabaseQuery"
    messages:
      - $ref: "#/channels/DatabaseQuery/messages/SqlBatch"
    title: Execute batch SQL statements
  sendAlertFromGateway:
    action: send
    channel:
      $ref: "#/channels/TelegramNotification"
    messages:
      - $ref: "#/channels/TelegramNotification/messages/TelegramAlert"
    summary: Gateway sends trade confirmation to Telegram
    title: Send trade notification
  sendAlertFromAgent:
    action: send
    channel:
      $ref: "#/channels/TelegramNotification"
    messages:
      - $ref: "#/channels/TelegramNotification/messages/TelegramAlert"
    summary: Agent-worker sends risk assessment alerts to Telegram
    title: Send risk alert
  sendAlertFromWallet:
    action: send
    channel:
      $ref: "#/channels/TelegramNotification"
    messages:
      - $ref: "#/channels/TelegramNotification/messages/TelegramAlert"
    summary: Web3-wallet-worker sends DeFi operation results to Telegram
    title: Send wallet notification
  sendAlertFromReport:
    action: send
    channel:
      $ref: "#/channels/TelegramNotification"
    messages:
      - $ref: "#/channels/TelegramNotification/messages/TelegramAlert"
    summary: Report-worker sends PDF report delivery notification to Telegram
    title: Send report notification
  receiveAlert:
    action: receive
    channel:
      $ref: "#/channels/TelegramNotification"
    messages:
      - $ref: "#/channels/TelegramNotification/messages/TelegramAlert"
    summary: Telegram-worker receives and dispatches notification
    title: Receive notification request
  executeWalletOp:
    action: send
    channel:
      $ref: "#/channels/WalletOperation"
    messages:
      - $ref: "#/channels/WalletOperation/messages/DexSwap"
    summary: Gateway forwards /wallet/* requests to web3-wallet-worker
    title: Execute wallet operation
  scheduledRiskCheck:
    action: receive
    channel:
      $ref: "#/channels/risk~1cron"
    messages:
      - $ref: "#/channels/risk~1cron/messages/RiskOverride"
    summary: 5-minute cron trigger for automated risk analysis
    title: Scheduled risk assessment
  chatWithAI:
    action: receive
    channel:
      $ref: "#/channels/risk~1chat"
    messages:
      - $ref: "#/channels/risk~1chat/messages/AiChatRequest"
    summary: Conversational AI request from dashboard or CLI
    title: AI chat session
  generateEmbedding:
    action: receive
    channel:
      $ref: "#/channels/risk~1embedding"
    messages:
      - $ref: "#/channels/risk~1embedding/messages/EmbeddingRequest"
    summary: Vector embedding request from dashboard or automation
    title: Generate text embedding
  getAgentConfig:
    action: receive
    channel:
      $ref: "#/channels/risk~1config"
    messages:
      - $ref: "#/channels/risk~1config/messages/AgentConfig"
    summary: Dashboard or CLI reads the current provider manager config
    title: Read agent configuration
  updateAgentConfig:
    action: send
    channel:
      $ref: "#/channels/risk~1config"
    messages:
      - $ref: "#/channels/risk~1config/messages/AgentConfig"
    summary: Dashboard or CLI updates the provider manager config
    title: Update agent configuration
  checkIdempotency:
    action: receive
    channel:
      $ref: "#/channels/IdempotencyStore"
    messages:
      - $ref: "#/channels/IdempotencyStore/messages/IdempotencyKey"
    summary: Durable Object RPC call to verify trade uniqueness
    title: Check and store idempotency key
  receiveEmail:
    action: receive
    channel:
      $ref: "#/channels/EmailParsing"
    messages:
      - $ref: "#/channels/EmailParsing/messages/EmailSignal"
    summary: Email-worker receives forwarded email with trade signal
    title: Receive incoming email
  forwardParsedSignal:
    action: send
    channel:
      $ref: "#/channels/EmailParsing"
    messages:
      - $ref: "#/channels/EmailParsing/messages/EmailSignal"
    summary: Email-worker sends parsed trade to trade-worker
    title: Forward parsed signal to execution
  trackApiCall:
    action: send
    channel:
      $ref: "#/channels/AnalyticsTracking"
    messages:
      - $ref: "#/channels/AnalyticsTracking/messages/AnalyticsEvent"
    summary: Workers emit analytics events after processing requests
    title: Track API call metric
  generateReport:
    action: receive
    channel:
      $ref: "#/channels/PDFReport"
    messages:
      - $ref: "#/channels/PDFReport/messages/ReportRequest"
    summary: Report-worker renders and returns a PDF document
    title: Generate PDF report
