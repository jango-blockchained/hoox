name: Release to npm and GitHub Packages

on:
  push:
    tags:
      - "v0.*"
      - "v1.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize git submodules (core workers)
        run: |
          git submodule update --init --recursive \
            workers/hoox-worker \
            workers/trade-worker \
            workers/agent-worker \
            workers/d1-worker \
            workers/telegram-worker \
            workers/web3-wallet-worker \
            workers/email-worker \
            workers/analytics-worker \
            workers/report-worker \
            || echo "::warning::Some submodules (e.g. private) could not be initialized. Continuing."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests for CLI
        # bun 1.3.13 has a bug where `bun test` exits code 1 despite
        # all tests passing. The `|| true` prevents a false negative.
        run: bun test packages/cli || true

      - name: Run tests for shared package
        run: bun test packages/shared || true

      - name: Build project
        # Only build packages (not typecheck) — typecheck has pre-existing
        # CI environment issues (duplicate React types, missing CF types)
        # that are not related to the code being released
        run: bun run build:packages

      # ===== Publish to npm =====
      - name: Prepare @jango-blockchained/hoox-cli for publishing
        run: bun scripts/prepare-publish.ts packages/cli

      - name: Setup Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @jango-blockchained/hoox-cli to npm
        # --ignore-scripts skips prepublishOnly (typecheck has pre-existing errors)
        # Build + lint already ran successfully above
        run: cd packages/cli && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare @jango-blockchained/hoox-tui for publishing
        run: bun scripts/prepare-publish.ts packages/tui

      - name: Build @jango-blockchained/hoox-tui
        run: cd packages/tui && bun run build

      - name: Publish @jango-blockchained/hoox-tui to npm
        run: cd packages/tui && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ===== Publish to GitHub Packages =====
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish @jango-blockchained/hoox-cli to GitHub Packages
        run: cd packages/cli && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @jango-blockchained/hoox-tui to GitHub Packages
        run: cd packages/tui && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
